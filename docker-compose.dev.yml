services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: co14ners
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - api_root_modules:/app/node_modules
      - api_pkg_modules:/app/packages/api/node_modules
    env_file:
      - packages/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/co14ners
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "bun install &&
             bun run --watch packages/api/src/index.ts"

  app:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - app_root_modules:/app/node_modules
      - app_pkg_modules:/app/packages/app/node_modules
      - app_next_cache:/app/packages/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: >
      sh -c "bun install &&
             cd packages/app && bun run dev"

volumes:
  postgres_data:
  api_root_modules:
  api_pkg_modules:
  app_root_modules:
  app_pkg_modules:
  app_next_cache:
