services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: co14ners
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/co14ners
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    # Run db push on startup (use `prisma migrate deploy` once you add migrations)
    command: >
      sh -c "cd packages/api &&
             bunx prisma db push --skip-generate &&
             cd /app &&
             bun run packages/api/src/index.ts"

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

volumes:
  postgres_data:
